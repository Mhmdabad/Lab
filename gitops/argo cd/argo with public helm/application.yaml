apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: public-helm-demo
  namespace: argocd

spec:
  project: public-helm-project

  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.15.0

    helm:
      parameters:
        - name: replicaCount
          value: "3"

  destination:
    server: https://kubernetes.default.svc
    namespace: public-helm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true