apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  replicas: 4

  selector:
    matchLabels:
      app: nginx-demo

  template:
    metadata:
      labels:
        app: nginx-demo

    spec:
      containers:
        - name: nginx
          image: nginx:1.27

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: nginx-config