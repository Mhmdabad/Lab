# Group 1: Web servers
[webservers]
192.168.1.10
192.168.1.11

# Group 2: Database servers (with custom SSH user override)
[dbservers]
10.0.0.50 ansible_user=ubuntu

# Group of Groups
[production:children]
webservers
dbservers

# Global variables applied to all servers
[all:vars]
ansible_ssh_port=22