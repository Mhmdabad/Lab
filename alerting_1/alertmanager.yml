# ============================================
# Alertmanager Configuration
# ============================================
# Alertmanager receives FIRED alerts from
# Prometheus and decides:
#   1. WHO to notify (receivers)
#   2. HOW to group them (routing)
#   3. WHEN to suppress them (inhibition)
# ============================================

global:
  resolve_timeout: 5m   # How long to wait before marking an alert as "resolved"

# ============================================
# ROUTE: Defines how alerts are routed to receivers
# ============================================
# Think of this like an if/else chain:
#   - The top-level route is the DEFAULT (catch-all)
#   - Child routes match specific labels
# ============================================
route:
  # Group alerts by their "alertname" label
  # e.g., all "HighCpuUsage" alerts go in one group
  group_by: ["alertname"]

  # Wait 30s to collect alerts in the same group before sending
  group_wait: 30s

  # Wait 5m before sending updates on the same group
  group_interval: 5m

  # Re-send the same alert every 4 hours if it's still firing
  repeat_interval: 4h

  # Default receiver (catch-all)
  receiver: "default-webhook"

  # ---------- Child Routes (label-based) ----------
  routes:
    # Critical alerts → go to a separate receiver
    - match:
        severity: critical
      receiver: "critical-webhook"
      repeat_interval: 1h   # Re-notify every hour for critical alerts

    # Warning alerts → go to default receiver
    - match:
        severity: warning
      receiver: "default-webhook"

# ============================================
# RECEIVERS: Define WHERE alerts are sent
# ============================================
# Replace the webhook URLs below with your
# actual Slack/Discord/Email configurations.
# ============================================
receivers:
  # --- Default Receiver (for warnings) ---
  - name: "default-webhook"
    webhook_configs:
      - url: "http://localhost:5001/"
        send_resolved: true   # Also send a notification when the alert resolves

  # --- Critical Receiver (for critical alerts) ---
  - name: "critical-webhook"
    webhook_configs:
      - url: "http://localhost:5001/"
        send_resolved: true

  # -----------------------------------------------
  # EXAMPLES OF REAL RECEIVERS (uncomment to use):
  # -----------------------------------------------

  # --- Slack Example ---
  # - name: "slack-notifications"
  #   slack_configs:
  #     - api_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  #       channel: "#alerts"
  #       title: '{{ .GroupLabels.alertname }}'
  #       text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
  #       send_resolved: true

  # --- Email Example ---
  # - name: "email-notifications"
  #   email_configs:
  #     - to: "you@example.com"
  #       from: "alertmanager@example.com"
  #       smarthost: "smtp.gmail.com:587"
  #       auth_username: "you@gmail.com"
  #       auth_password: "your-app-password"
  #       send_resolved: true

# ============================================
# INHIBITION RULES: Suppress noisy alerts
# ============================================
# If a "source" alert is firing, suppress the "target" alert.
# Example: If the entire server is down, don't also send
#          alerts about high CPU or memory on that same server.
# ============================================
inhibit_rules:
  - source_match:
      alertname: "ServerDown"
    target_match_re:
      alertname: "HighCpuUsage|HighMemoryUsage|DiskSpaceLow"
    equal: ["instance"]
    # ^ Only inhibit if both alerts are about the SAME instance

  - source_match:
      alertname: "ApiDown"
    target_match_re:
      alertname: "HighHttpErrorRate|SlowApiResponse"
    equal: ["instance"]
