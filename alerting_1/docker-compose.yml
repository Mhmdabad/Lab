services:
  # -------------------------------------------------------
  # 1. Init container: generates prometheus.yml from template
  #    by replacing ${API_HOST} with the value from .env
  # -------------------------------------------------------
  prometheus-config-init:
    image: busybox
    container_name: prometheus-config-init
    volumes:
      - .:/config
    environment:
      - API_HOST=${API_HOST}
    command: >
      sh -c "sed 's/\$${API_HOST}/'\"$${API_HOST}\"'/g' /config/prometheus.template.yml > /config/prometheus.yml"

  # -------------------------------------------------------
  # 2. Prometheus: scrapes metrics and evaluates alert rules
  # -------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "6060:9090"
    depends_on:
      prometheus-config-init:
        condition: service_completed_successfully
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    restart: unless-stopped

  # -------------------------------------------------------
  # 3. Alertmanager: receives fired alerts from Prometheus
  #    and routes them to receivers (email, slack, discord...)
  # -------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  # -------------------------------------------------------
  # 4. Grafana: visualization and dashboards
  # -------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "5050:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped
