# inventory.ini — the hosts Ansible manages.
#
# The [webservers] group has THREE hosts. Running the playbook against this
# group configures all three "simultaneously" (in parallel), which is the
# roadmap's "configure multiple servers at once" goal.
#
# Replace the IPs with your real servers, or point them at the EC2 instance
# Terraform created (see the web_public_ip output).

[webservers]
web1 ansible_host=10.0.1.11
web2 ansible_host=10.0.1.12
web3 ansible_host=10.0.1.13

# A group for a single database host, to show grouping.
[dbservers]
db1 ansible_host=10.0.1.21

# Group-of-groups: "production" contains both webservers and dbservers.
[production:children]
webservers
dbservers

# Connection variables applied to every host.
[all:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
