# ansible.cfg — project-local Ansible defaults.
# Having this file in the project root means you don't pass -i every time.

[defaults]
inventory            = ./inventory.ini
host_key_checking    = False          # skip SSH host-key prompts in a lab
retry_files_enabled  = False
stdout_callback      = yaml           # readable output
roles_path           = ./roles
interpreter_python   = auto_silent

[privilege_escalation]
become        = True                  # use sudo by default
become_method = sudo
become_user   = root
