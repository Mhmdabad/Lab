# CONCEPT: Secret — sensitive config. Values are base64-encoded (NOT encrypted
# at rest by default — for real secrets use Vault / sealed-secrets / SOPS).
#
# "demo-token" -> base64 -> ZGVtby10b2tlbg==
#
# NOTE: secret scanners (Gitleaks) correctly flag committed K8s Secrets — that's
# exactly why you should NOT commit real ones. This value is a throwaway demo
# token, so we tell Gitleaks to allow it with an inline `gitleaks:allow`.
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
  namespace: roadmap-demo
type: Opaque
data:
  API_TOKEN: ZGVtby10b2tlbg== # gitleaks:allow  (demo token, not a real secret)
