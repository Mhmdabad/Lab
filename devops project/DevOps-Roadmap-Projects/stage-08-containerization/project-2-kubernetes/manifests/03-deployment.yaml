# CONCEPT: Deployment — declares the desired state of a set of Pods and keeps
# them running (self-healing, rolling updates, scaling).
#
# Uses nginx-unprivileged so it runs as a NON-root user out of the box and is
# fully runnable on a local cluster (kind/minikube/Docker Desktop) with no
# registry push required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: roadmap-demo
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 3 # three Pods for availability + to see load-balancing
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    type: RollingUpdate # zero-downtime updates
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      # Pod-level security hardening.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - name: http
              containerPort: 8080

          # Config from ConfigMap + Secret (CONCEPT: injecting config).
          env:
            - name: APP_GREETING
              valueFrom:
                configMapKeyRef: { name: web-config, key: APP_GREETING }
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: { name: web-config, key: APP_ENV }
            - name: API_TOKEN
              valueFrom:
                secretKeyRef: { name: web-secret, key: API_TOKEN }

          # CONCEPT: resource requests (for scheduling) & limits (for capping).
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }

          # CONCEPT: probes — how K8s knows a Pod is alive/ready/started.
          startupProbe: # gives slow starters time before liveness kicks in
            httpGet: { path: /, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe: # restart the container if this fails
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe: # remove from Service endpoints if this fails
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5

          # Container-level hardening.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # nginx needs a few writable paths; give it in-memory emptyDirs so the
          # root filesystem can stay read-only.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
