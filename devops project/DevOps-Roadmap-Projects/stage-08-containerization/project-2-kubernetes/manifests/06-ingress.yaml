# CONCEPT: Ingress — HTTP routing from outside the cluster to a Service.
# Needs an ingress controller (e.g. ingress-nginx) installed in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: roadmap-demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: roadmap.local # add to your hosts file -> 127.0.0.1
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
