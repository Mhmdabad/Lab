# Grafana auto-provisions these datasources on startup — no clicking required.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus # fixed uid so provisioned dashboards can reference it
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
