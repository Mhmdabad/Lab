global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'shadoom-api'
    scheme: https
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api.shadoom.social']
        labels:
          service: 'shadoom-api'
          env: 'production'
    basic_auth:
      username: 'prom'
      password_file: /etc/prometheus/metrics_password   # secret, not inline