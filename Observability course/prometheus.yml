# Global configuration settings
global:
  scrape_interval: 15s      # How frequently to scrape targets by default
  evaluation_interval: 15s  # How frequently to evaluate rules
  scrape_timeout: 10s       # How long to wait before timing out a scrape request

# Alertmanager configuration (optional - uncomment when ready to route alerts)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           # - alertmanager:9093

# Load rules once and periodically evaluate them according to 'evaluation_interval'
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Scrape configurations containing the endpoints to monitor
scrape_configs:
  # Job 1: Prometheus monitoring itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Job 2: Node Exporter (OS/Infrastructure metrics)
  - job_name: "node_exporter"
    static_configs:
      - targets: ["localhost:9100"] # Replace 'localhost' with server IP/hostname if remote