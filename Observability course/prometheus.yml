global:
  scrape_interval: 15s     # How frequently to scrape targets
  evaluation_interval: 15s # How frequently to evaluate rules

scrape_configs:
  # 1. Prometheus monitoring its own app health
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Node Exporter monitoring your server hardware (CPU/RAM/Disk)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['localhost:9100']

  # 3. Your Backend Application metrics
  - job_name: 'shadoom_backend'
    metrics_path: '/metrics' # Explicit path (default is /metrics, shown for clarity)
    static_configs:
      - targets: ['localhost:5555']