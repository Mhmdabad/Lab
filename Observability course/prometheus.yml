global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'droplet_node_exporter'
    static_configs:
      - targets: ['${DROPLET_IP}:9100']

  - job_name: 'shadoom_backend'
    scheme: https
    metrics_path: '/metrics'
    basic_auth:
      username: '${METRICS_USER}'
      password: '${METRICS_PASSWORD}'
    static_configs:
      - targets: ['${METRICS_DOMAIN}']