name: API Tests

on:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Postman tests only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            qa/postman

      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests
        run: |
          newman run "qa/postman/Real QA API Test Project.postman_collection.json" \
            -e "qa/postman/QA test environment.postman_environment.json" \
            -d "qa/postman/users.csv"